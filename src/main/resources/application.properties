spring.application.name=paddock-api

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false
management.health.ssl.enabled=false

# Connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/tracktime,classpath:db/migration/marketplace
spring.flyway.schemas=${DB_SCHEMA}
spring.flyway.default-schema=${DB_SCHEMA}
spring.flyway.repair-on-migrate=true

# Graceful shutdown
server.shutdown=graceful

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}

# Logging
logging.structured.format.console=ecs

# OpenAPI
springdoc.api-docs.enabled=false

# Scalar
scalar.enabled=false